name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: catch rootpuller-proto@main drift within a day.
    - cron: "17 4 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH for rootpuller-proto
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ROOTPULLER_PROTO_DEPLOY_KEY }}

      - name: Regenerate protobuf stubs from rootpuller-proto@main
        run: task generate-protobuf

      - name: Fail on stub drift
        run: git diff --exit-code internal/gen

      # A compile failure here is the semantic drift alarm: every proto
      # field is explicitly mapped in the hand-written facade.
      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Facade no-gen-leak check
        run: task lint-no-gen-leak

      - name: Test
        run: go test -race ./...
